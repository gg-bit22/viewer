<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>시리즈 뷰어</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #222222;
            --input-bg: #f9f9f9;
            --primary-color: #00c73c; /* 네이버 포인트 컬러 */
            --safe-area-top: env(safe-area-inset-top, 0px);
        }

        /* 배경 테마 설정 */
        body.theme-white { --bg-color: #ffffff; --text-color: #222222; }
        body.theme-ivory { --bg-color: #f4f0ea; --text-color: #332d29; } /* 눈이 편한 크림/아이보리 */
        body.theme-sepia { --bg-color: #e8dec8; --text-color: #403225; }
        body.theme-dark  { --bg-color: #121212; --text-color: #d1d1d1; }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        .app-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .page-section {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease-in-out;
            background-color: var(--bg-color);
        }

        /* --- [1단계] 입력 섹션 --- */
        #stepInput {
            transform: translateX(0);
            z-index: 10;
        }

        .input-header {
            padding: calc(12px + var(--safe-area-top)) 16px 12px;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-header h1 {
            margin: 0;
            font-size: 15px;
        }

        .main-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .editor-container {
            flex: 1;
            padding: 16px;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            background: #fff;
            color: #222;
            margin-bottom: 12px;
        }

        .clipboard-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* --- [2단계] 시리즈 뷰어 섹션 --- */
        #stepView {
            transform: translateX(100%);
            z-index: 20;
        }

        .viewer-header {
            padding: calc(8px + var(--safe-area-top)) 12px 8px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .viewer-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .viewer-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 테마 선택 드롭다운 */
        select.viewer-btn {
            background: #333;
            color: #fff;
            outline: none;
        }

        /* 시리즈 조판 뷰어 본문 */
        .series-viewport {
            flex: 1;
            padding: 24px 22px;
            overflow-y: auto;
            color: var(--text-color);
            background-color: var(--bg-color);
            
            /* 기본 네이버 시리즈 조판 규격 */
            font-family: "KoPubWorldBatang", "KoPubBatang", "Nanum Myeongjo", serif;
            font-size: 16px; /* 기본 크기 */
            line-height: 1.8;
            letter-spacing: -0.03em;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .slide-in {
            transform: translateX(0) !important;
        }
    </style>
</head>
<body class="theme-white">

<div class="app-wrapper" id="appWrapper">

    <!-- [1단계] 원고 붙여넣기 섹션 -->
    <div id="stepInput" class="page-section">
        <div class="input-header">
            <h1>원고 입력</h1>
            <button class="main-btn" onclick="moveToViewer()">다음 ➔</button>
        </div>
        
        <div class="editor-container">
            <textarea id="rawInput" placeholder="여기에 원고를 입력하거나 아래 [📋 클립보드 붙여넣기]를 누르세요."></textarea>
            <button class="clipboard-btn" onclick="pasteFromClipboard()">📋 클립보드 붙여넣기 및 바로 보기</button>
        </div>
    </div>

    <!-- [2단계] 시리즈 뷰어 섹션 -->
    <div id="stepView" class="page-section">
        <div class="viewer-header">
            <button class="viewer-btn" onclick="moveToInput()">🔙 뒤로</button>
            
            <div class="viewer-controls">
                <!-- 글자 크기 조절 -->
                <button class="viewer-btn" onclick="changeFontSize(-1)">A-</button>
                <button class="viewer-btn" onclick="changeFontSize(1)">A+</button>
                
                <!-- 폰트 체인지 -->
                <button class="viewer-btn" onclick="toggleFont()">글꼴</button>

                <!-- 배경 테마 선택 샘플 -->
                <select class="viewer-btn" onchange="changeTheme(this.value)">
                    <option value="theme-white">화이트</option>
                    <option value="theme-ivory" selected>아이보리</option>
                    <option value="theme-sepia">세피아</option>
                    <option value="theme-dark">다크</option>
                </select>

                <!-- 완전 전체화면 토글 -->
                <button class="viewer-btn" onclick="toggleFullscreen()">⛶ 전체화면</button>
            </div>
        </div>
        
        <!-- 미리보기 뷰어 영역 -->
        <div id="seriesViewer" class="series-viewport"></div>
    </div>

</div>

<script>
    const rawInput = document.getElementById('rawInput');
    const seriesViewer = document.getElementById('seriesViewer');
    const stepInput = document.getElementById('stepInput');
    const stepView = document.getElementById('stepView');
    const appWrapper = document.getElementById('appWrapper');

    let currentFontSize = 16; // 기본 글자 크기 (px)

    // 1. 뷰어 화면으로 이동
    function moveToViewer() {
        const text = rawInput.value;
        if (!text.trim()) {
            alert('원고를 먼저 입력해 주세요.');
            rawInput.focus();
            return;
        }

        seriesViewer.textContent = text;
        seriesViewer.scrollTop = 0;

        stepInput.style.transform = 'translateX(-100%)';
        stepView.classList.add('slide-in');
    }

    // 2. 입력 화면으로 복귀
    function moveToInput() {
        // 전체화면이 켜져 있다면 해제
        if (document.fullscreenElement) {
            document.exitFullscreen();
        }
        stepInput.style.transform = 'translateX(0)';
        stepView.classList.remove('slide-in');
    }

    // 3. 클립보드 붙여넣기
    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                rawInput.value = text;
                moveToViewer();
            } else {
                alert('클립보드에 복사된 텍스트가 없습니다.');
            }
        } catch (err) {
            alert('입력창을 터치한 뒤 팝업 메뉴에서 [붙여넣기]를 직접 진행해 주세요.');
            rawInput.focus();
        }
    }

    // 4. 글자 크기 조절 기능 (최대/최소 제한)
    function changeFontSize(delta) {
        currentFontSize += delta;
        if (currentFontSize < 12) currentFontSize = 12;
        if (currentFontSize > 26) currentFontSize = 26;
        seriesViewer.style.fontSize = currentFontSize + 'px';
    }

    // 5. 바탕/명조 <-> 고딕 폰트 토글
    let isSerif = true;
    function toggleFont() {
        isSerif = !isSerif;
        if (isSerif) {
            seriesViewer.style.fontFamily = '"KoPubWorldBatang", "KoPubBatang", "Nanum Myeongjo", serif';
        } else {
            seriesViewer.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif';
        }
    }

    // 6. 배경 테마 변경 (화이트/아이보리/세피아/다크)
    function changeTheme(themeClass) {
        document.body.className = themeClass;
    }

    // 기본 테마를 눈이 편한 아이보리로 설정
    document.body.className = 'theme-ivory';

    // 7. 완전 전체화면 (주소창 숨기기) 토글 기능
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            if (appWrapper.requestFullscreen) {
                appWrapper.requestFullscreen();
            } else if (appWrapper.webkitRequestFullscreen) { /* 아이폰/사파리 대응 */
                appWrapper.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>

</body>
</html>
