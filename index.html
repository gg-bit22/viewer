<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 모바일 앱처럼 보이게 만드는 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>시리즈 뷰어</title>
    <style>
        :root {
            /* 라이트모드 색상 */
            --bg-color: #ffffff;
            --input-bg: #f9f9f9;
            --text-color: #222222;
            --btn-bg: #333333;
            --btn-text: #ffffff;
            --primary-color: #00c73c; /* 네이버 포인트 컬러 */
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }

        /* 다크모드 설정 */
        body.dark-mode {
            --bg-color: #1e1e1e;
            --input-bg: #2a2a2a;
            --text-color: #d1d1d1;
            --btn-bg: #444444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden; /* 스크롤은 각 섹션 내에서 처리 */
            height: 100vh;
        }

        /* 앱 전체 컨테이너 */
        .app-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 각 단계별 전체화면 섹션 공통 스타일 */
        .page-section {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease-in-out; /* 화면 전환 애니메이션 */
            background-color: var(--bg-color);
        }

        /* --- [1단계] 원고 붙여넣기 섹션 --- */
        #stepInput {
            transform: translateX(0); /* 기본 화면 */
            z-index: 10;
        }

        .input-header {
            padding: calc(15px + var(--safe-area-inset-top)) 20px 15px;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-header h1 {
            margin: 0;
            font-size: 16px;
        }

        .main-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .editor-container {
            flex: 1;
            padding: 20px;
            background-color: var(--input-bg);
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            background: #fff;
            color: #333;
            margin-bottom: 15px;
        }

        .clipboard-btn {
            background-color: #555;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* --- [2단계] 시리즈 뷰어 섹션 (전체화면) --- */
        #stepView {
            transform: translateX(100%); /* 처음에 오른쪽에 숨김 */
            z-index: 20;
        }

        /* 뷰어 화면 상단바 (실제 앱처럼 얇게) */
        .viewer-header {
            padding: calc(10px + var(--safe-area-inset-top)) 15px 10px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .viewer-header-btns {
            display: flex;
            gap: 8px;
        }

        .viewer-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 시리즈 조판 뷰어 메인 영역 (전체화면) */
        .series-viewport {
            flex: 1;
            padding: 30px 22px; /* 시리즈 표준 여백 */
            overflow-y: auto;
            color: var(--text-color);
            background-color: var(--bg-color);
            
            /* 네이버 시리즈 조판 규격 */
            font-family: "KoPubWorldBatang", "KoPubBatang", "Nanum Myeongjo", serif; /* 명조체 기본 */
            font-size: 16px;
            line-height: 1.8; /* 시리즈 행간 비율 */
            letter-spacing: -0.03em; /* 자간 */
            word-break: break-all; /* 한글 단어 끊김 대응 */
            white-space: pre-wrap; /* 줄바꿈 유지 */
        }

        /* 화면 전환 시 애니메이션 클래스 */
        .slide-in {
            transform: translateX(0) !important;
        }

    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- [1단계] 원고 붙여넣기 섹션 -->
    <div id="stepInput" class="page-section">
        <div class="input-header">
            <h1>원고 입력</h1>
            <button class="main-btn" onclick="moveToViewer()">다음 ➔</button>
        </div>
        
        <div class="editor-container">
            <textarea id="rawInput" placeholder="여기에 원고를 직접 입력하거나 아래 [📋 클립보드 붙여넣기] 버튼을 누르세요."></textarea>
            <button class="clipboard-btn" onclick="pasteFromClipboard()">📋 클립보드 붙여넣기 및 바로 보기</button>
        </div>
    </div>

    <!-- [2단계] 시리즈 뷰어 섹션 -->
    <div id="stepView" class="page-section">
        <div class="viewer-header">
            <button class="viewer-btn" onclick="moveToInput()">🔙 뒤로</button>
            <div class="viewer-header-btns">
                <button class="viewer-btn" onclick="toggleFont()">글꼴 변경</button>
                <button class="viewer-btn" onclick="toggleDarkMode()">다크모드</button>
            </div>
        </div>
        
        <!-- 이 영역이 핸드폰 전체화면에서 시리즈 조판으로 보입니다. -->
        <div id="seriesViewer" class="series-viewport"></div>
    </div>

</div>

<script>
    const rawInput = document.getElementById('rawInput');
    const seriesViewer = document.getElementById('seriesViewer');
    const stepInput = document.getElementById('stepInput');
    const stepView = document.getElementById('stepView');

    // 1. [1단계 -> 2단계] 뷰어 화면으로 이동 (전체화면 전환)
    function moveToViewer() {
        const text = rawInput.value;
        if (!text.trim()) {
            alert('원고를 먼저 입력해 주세요.');
            rawInput.focus();
            return;
        }

        // 입력된 텍스트를 뷰어에 동기화
        seriesViewer.textContent = text;
        seriesViewer.scrollTop = 0; // 스크롤 맨 위로 초기화

        // 화면 전환 애니메이션
        stepInput.style.transform = 'translateX(-100%)'; // 입력창은 왼쪽으로 숨김
        stepView.classList.add('slide-in'); // 뷰어창이 오른쪽에서 들어옴
    }

    // 2. [2단계 -> 1단계] 입력 화면으로 되돌아가기
    function moveToInput() {
        stepInput.style.transform = 'translateX(0)';
        stepView.classList.remove('slide-in');
    }

    // 3. 클립보드 자동 붙여넣기 편의 기능
    async function pasteFromClipboard() {
        try {
            // 모바일에서 클립보드 접근 권한 필요
            const text = await navigator.clipboard.readText();
            if (text) {
                rawInput.value = text;
                // 붙여넣기 성공 시 바로 뷰어 모드로 전환
                moveToViewer();
            } else {
                alert('클립보드에 복사된 텍스트가 없습니다.');
            }
        } catch (err) {
            // 브라우저 보안 정책상 직접 입력을 유도
            alert('입력창을 터치한 뒤 팝업 메뉴에서 [붙여넣기]를 직접 진행해 주세요.');
            rawInput.focus();
        }
    }

    // 4. 뷰어 옵션: 폰트 변경 (명조 <-> 고딕)
    let isSerif = true;
    function toggleFont() {
        isSerif = !isSerif;
        if (isSerif) {
            seriesViewer.style.fontFamily = '"KoPubWorldBatang", "KoPubBatang", "Nanum Myeongjo", serif';
        } else {
            seriesViewer.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif';
        }
    }

    // 5. 뷰어 옵션: 다크모드 토글
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    }
</script>

</body>
</html>
